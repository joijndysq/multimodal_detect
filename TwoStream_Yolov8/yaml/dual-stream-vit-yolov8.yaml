# Dual-stream YOLOv8 with windowed bidirectional Vision Transformer fusion.
# Input layout: six channels ordered as RGB (0:3) followed by infrared (3:6).

nc: 5
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]

backbone:
  # RGB branch, P1-P3
  - [-1, 1, Conv, [64, 3, 2]]                         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 1-P2/4
  - [-1, 3, C2f, [128, True]]                         # 2-RGB P2
  - [-1, 1, Conv, [256, 3, 2]]                        # 3-RGB P3/8
  - [-1, 3, C2f, [256, True]]                         # 4-RGB P3

  # Infrared branch, P1-P3
  - [-4, 1, Conv, [64, 3, 2]]                         # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 6-P2/4
  - [-1, 3, C2f, [128, True]]                         # 7-IR P2
  - [-1, 1, Conv, [256, 3, 2]]                        # 8-IR P3/8
  - [-1, 3, C2f, [256, True]]                         # 9-IR P3

  # Local cross-modal ViT at P3. Args: channels, heads, window, MLP ratio, dropout.
  - [[4, 9], 1, DualStreamViTFusion, [256, 4, 8, 2.0, 0.0]]  # 10-fused P3

  # Separate P4 representations retain modality-specific evidence.
  - [4, 1, Conv, [512, 3, 2]]                         # 11-RGB P4/16
  - [-1, 3, C2f, [512, True]]                         # 12-RGB P4
  - [9, 1, Conv, [512, 3, 2]]                         # 13-IR P4/16
  - [-1, 3, C2f, [512, True]]                         # 14-IR P4
  - [[12, 14], 1, DualStreamViTFusion, [512, 4, 8, 2.0, 0.0]] # 15-fused P4

  # Shared deep backbone
  - [-1, 1, Conv, [1024, 3, 2]]                       # 16-P5/32
  - [-1, 3, C2f, [1024, True]]                        # 17-P5
  - [-1, 1, SPPF, [1024, 5]]                          # 18-SPPF

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 19-P5 -> P4
  - [[-1, 15], 1, Concat, [1]]                        # 20
  - [-1, 3, C2f, [512]]                               # 21-FPN P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 22-P4 -> P3
  - [[-1, 10], 1, Concat, [1]]                        # 23
  - [-1, 3, C2f, [256]]                               # 24-FPN P3

  - [-1, 1, Conv, [256, 3, 2]]                        # 25-P3 -> P4
  - [[-1, 21], 1, Concat, [1]]                        # 26
  - [-1, 3, C2f, [512]]                               # 27-PAN P4

  - [-1, 1, Conv, [512, 3, 2]]                        # 28-P4 -> P5
  - [[-1, 18], 1, Concat, [1]]                        # 29
  - [-1, 3, C2f, [1024]]                              # 30-PAN P5

  - [[24, 27, 30], 1, Detect, [nc]]                   # 31-P3/P4/P5 Detect
